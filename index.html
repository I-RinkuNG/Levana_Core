<!doctype html>
<html lang="th" data-theme="mix">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Levana Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script>
(function(){var m;try{m=localStorage.getItem("lv-mode")}catch(e){}
if(m!=="light"&&m!=="dark")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
document.documentElement.dataset.mode=m})();
</script>
</head>
<body>
<header>
  <b>Levana Core</b>
  <select id="branch" aria-label="branch" hidden></select>
  <button id="logout" class="ghost" hidden>ลบ token</button>
  <button id="mode" type="button" aria-label="สลับโหมดสว่าง/มืด"></button>
</header>
<nav id="nav">
  <a href="#today">วันนี้</a>
  <a href="#overview">ภาพรวม</a>
  <a href="#issues">Issues</a>
  <a href="#stats">สถิติ</a>
  <a href="#files">ไฟล์</a>
  <a href="#agents">Agents</a>
  <a href="#errors">Errors</a>
</nav>
<main id="v"></main>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="parse.js"></script>
<script src="logic.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
